name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to release (must exist)'
        required: true


jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This plugin is dependency-free plain JavaScript: no build step needed,
      # just zip the plugin files (flat layout, manifest.json at zip root).
      - name: Pack plugin.zip
        run: zip -9 plugin.zip manifest.json main.js style.css README.md README.en.md

      - name: Generate release body
        run: |
          tag="${{ github.ref_name }}"
          prev_tag=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || echo "")
          if [ -n "$prev_tag" ]; then
            echo "## What's Changed" > release_body.md
            git log "$prev_tag..$tag" --oneline --no-decorate >> release_body.md
          else
            echo "## Initial release" > release_body.md
            git log --oneline --no-decorate "$tag" >> release_body.md
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "${{ github.ref_name }}"
          --notes-file release_body.md
          --verify-tag
          plugin.zip
